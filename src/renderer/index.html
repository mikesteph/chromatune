<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' ct:; img-src 'self' ct: data: blob:; media-src 'self' ct: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' ct: data:">
  <title>Chromatune</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="titlebar"></header>
    <div id="body">
      <aside id="sidebar"></aside>
      <div class="resizer" data-for="sidebar"></div>
      <section id="artists"></section>
      <div class="resizer r-artists" data-for="artists"></div>
      <main id="main"></main>
      <div class="resizer r-nowplaying" data-for="nowplaying"></div>
      <aside id="nowplaying"></aside>
    </div>
    <footer id="playerbar"></footer>
  </div>
  <div id="viz-full" hidden></div>
  <div id="drop-hint"><div class="dh-card"><div class="dh-ic"></div><div><b>Drop to add music</b><span>Drop on a playlist or folder in the sidebar to add it there</span></div></div></div>
  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
